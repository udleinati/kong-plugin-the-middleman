networks:
  playground-net:
    external: false

services:
  playground-redis:
    image: redis:8-alpine
    restart: on-failure
    networks:
      - playground-net
    ports:
      - "6379:6379/tcp"

  # Kong in db-less mode: no postgres, no migrations. The configuration comes
  # from the declarative kong.yml mounted below.
  playground-kong:
    image: kong:3.9.2
    depends_on:
      - playground-redis
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong.yml
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: '0.0.0.0:8001'
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PLUGINS: bundled,the-middleman
    volumes:
      - ../kong/plugins/the-middleman:/usr/local/share/lua/5.1/kong/plugins/the-middleman:ro
      - ./kong.yml:/kong.yml:ro
    restart: on-failure
    networks:
      - playground-net
    ports:
      - "8000:8000/tcp"
      - "127.0.0.1:8001:8001/tcp"

  playground-destination-service:
    image: denoland/deno:2.8.2
    entrypoint: [ "deno", "run", "--allow-net", "--allow-env", "/app/destination-service.js" ]
    environment:
      PORT: 3200
    volumes:
      - ./app:/app:ro
    networks:
      - playground-net
    ports:
      - 3200:3200

  playground-middle-service:
    image: denoland/deno:2.8.2
    entrypoint: [ "deno", "run", "--allow-net", "--allow-env", "/app/middle-service.js" ]
    environment:
      PORT: 3400
    volumes:
      - ./app:/app:ro
    networks:
      - playground-net
    ports:
      - 3400:3400
